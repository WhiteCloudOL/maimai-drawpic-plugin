name: 功能请求
description: 提议新的使用能力或体验改进
title: "[功能请求] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请说明实际使用场景和期望效果，便于判断功能范围与优先级。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已更新到插件的最新版本，并确认当前版本没有此功能。
          required: true
        - label: 我已搜索现有 Issue，确认没有相同请求。
          required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: 系统环境
      description: 选择运行 MaiBot 的系统；使用容器时可在补充信息中说明部署方式。
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明你在什么情况下需要这个功能，以及当前遇到的困难。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望功能
      description: 描述期望的操作方式、输入和结果。
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: 示例
      description: 提供命令、配置、交互流程或类似产品链接等示例。

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
      description: 如果你正在使用临时方案，请说明其限制。

  - type: dropdown
    id: pull_request
    attributes:
      label: 是否愿意提交 Pull Request
      description: 是否愿意提交 Pull Request 实现这个功能？
      options:
        - 愿意
        - 不愿意
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 添加其他有助于理解需求的信息或截图。
