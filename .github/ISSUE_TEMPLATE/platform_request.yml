name: 平台接入请求
description: 告诉我们你希望新增的绘图平台
title: "[平台请求] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        填写平台名称和官网即可；如果找到了公开的使用说明或开发文档，也可以附上链接。
        接入细节由维护者核对，请勿提交密钥、账号或其他个人信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索 README 和现有 Issue，确认该平台或模型尚未被支持或请求。
          required: true

  - type: input
    id: platform_name
    attributes:
      label: 平台名称
      placeholder: 例如 Example AI
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: 官方网站
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: api_docs
    attributes:
      label: 公开文档链接（可选）
      description: 官网的帮助、使用说明或开发文档均可；找不到可以留空。
      placeholder: https://example.com/docs

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可选，简单说明你想用这个平台完成什么。
