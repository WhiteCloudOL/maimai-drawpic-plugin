# 绘图编排层（参考实现）
# 行尾：LF 无 BOM ｜ 改完热重载即生效（改 .py 需重载插件/重启 runner）
#
# 本插件是「判断 + 取图 + 分发」的统一入口，底下挂多个生图引擎。
# 接引擎是刻意的：只有自己直连，才能在主模型被版权拦截时切兜底模型，
# 并保证不支持参考图的引擎绝不会拿到源图。

[plugin]
name = "art_orchestrator"
version = "1.1.11"
config_version = "1.6.0"
enabled = true

[lanes]
# 四条通道；关掉某条后对应需求会被降级或拒绝
# self          = 她自己出镜 → 图生图引擎（人物形象图+可选会话图，按引擎计价）
# cast          = 全是别人、没有她 → 按每个角色的参考图出图（按引擎计价）
# illustration  = 纯插画     → 按 engines.illustration_engine 选（默认 drawpic 不单独计费）
# reference     = 参考图改编 → 按 engines.reference_engine 选（默认 ark，真图生图）
#
# 🔴 角色参考图搜不到时（cast / 合照里的同伴 / cos 换装）：整单拒绝并请对方发图，
#    不再降级成水墨小画——画风不对、人也不对，还白扣一次额度。唯一例外：
#    reference 通道搜不到「画面里的实物」（search_query）时仍按文字直接画。
self_lane = true
cast = true
illustration = true
reference = true

[limits]
# self 通道每日上限。超了直接拒绝，不悄悄降级成别的画风。
# 额度是部署侧可选约束，通用实现不强加每日上限。
daily_self_max = 2
# 该通道每日上限（可选，按部署需要配置）。
daily_reference_max = 3
# 该通道每日上限（可选，按部署需要配置）。
daily_cast_max = 2
# 一次工具调用里最多等下游多久（只用于 submit 的 RPC，不等出图）
submit_timeout_seconds = 20
# 多人合照时，除她自己外最多再画几个角色（每多一人多一次搜图 + 一次视觉审核）
# 3 = 连她自己最多 4 人。参考图上限跟 engines.ark.max_references 一起看：1 + 3 + 1 张场景图 = 5。
max_companions = 3
# 每个角色最多用几张搜来的参考图（不同角度 / 全身与细节）。
# 出图永远只有一张；多给几张是为了让模型把侧面、背面、头饰细节看全。
# 1 = 只用一张立绘（最省，也最容易把背面画错）；跟 max_references 一起看：
# 她 1 + 3 位同伴 × 2 + 1 张场景图 = 8 张。
refs_per_subject = 2

[reference]
# 聊天图取不到时，是否允许回退到「最近 20 条里唯一一张图」
chat_recent_fallback = true
# 下载外链参考图的体积上限（字节）
download_max_bytes = 8388608
# 下载超时（秒）
download_timeout_seconds = 20
# 只允许这些域名（留空 = 允许任意公网 http/https）
allowed_hosts = []

[search]
# 联网搜参考图：搜 → 下载候选 → 视觉模型逐张审核 → 合格才用。
# 只在「画面主语是具体已有的东西、且用户没给图」时触发；全部失败就退回原通道。
enabled = true
# 数据源：auto = 先 360 图片搜索（快），没结果或审核不过再走 DeepSeek 网页搜索；
# image_search = 只用 360；ds_web = 只用 DeepSeek 网页搜索（对新实装角色更准，实测 6 个页面挖到 6 张可用立绘）
provider = "auto"
# 候选接口在 image_search_plugin 插件里，只返回链接，不下载不发图
api_plugin = "example.image-search"
api_operation = "search_image_candidates"
max_candidates = 6
# ds_web 最多抓几个网页（每个页面取前几张图）
ds_web_max_pages = 4
# 每轮最多下载几张交给视觉模型（一次请求可审核多张，实测 1 秒完成）
max_review = 4
# 审核用宿主 vlm 任务跑，但模型直选 DeepSeek 视觉（该模型 extra_params 已关思考）
# 注意：宿主的 task_name 必须是已有任务，不能自造 art_review 这类名字
review_task = "vlm"
review_model = "deepseek-flash-vision"
review_max_tokens = 1200
review_timeout_seconds = 25
download_timeout_seconds = 12
download_max_bytes = 6291456
# 审核通过线：0-5 分，低于此分宁可不用
min_score = 3
# 候选图最短边门槛：太小的资讯横幅对服装参考没价值
min_edge = 500
# 第一轮全不合格时，第二轮补这个后缀再搜一次；留空 = 不重试
fallback_suffix = "全身"

[self_channel]
# 判定「要画她自己」的关键词。命中且没要求参考图时走 self 通道。
# 宁窄勿宽：误判成 self 会走计费引擎，漏判只是走了插画通道。
keywords = [
    "自拍",
    "画你",
    "画她自己",
    "你的样子",
    "你穿",
    "你的照片",
    "来张你的",
    "你的自画像",
    "selfie",
    # 2026-11-11 18:10 补：对方常把「你」写成「你和她」「我们要…」，
    # 原表只认「你穿」，判路 LLM 失效/降级复核时就会漏成插画。
    "你和她",
    "我和她",
    "我们俩",
    "我们两个",
    "你要穿",
    "我穿",
    # 2026-11-11 19:0x 补：判路 LLM 超时/失败时全靠这张表兜底，
    # 「把我也画上」「画咱俩」漏了就会掉回 reference，她被画成路人。
    "咱俩",
    "你俩",
    "把我也",
    "加上我",
]

[intent]
# v0.6：画图意图改用插件内部 LLM 判别（走宿主 utils 任务，按模型计价，
# 计入 llm_usage 账本）。判别失败/超时/输出非法时自动回退到 self_channel.keywords 关键词规则。
use_llm = true
model_task = "utils"
timeout_seconds = 12.0
# 判别提示词，可编辑；留空 = 直接走关键词规则。
# 改这里热重载即生效（[intent] 属插件 config.toml，走 apply_plugin_config 热更新）。
prompt = """你是绘图意图判别器。根据用户请求判断走哪条绘图通道、画面里有哪些人物、要几张图，只输出 JSON。

四条通道：
- self：画面里有她自己（主角色本人）。包括自画像、自拍、「画你/画你自己/你的样子/你穿……」，以及「照着这张图画你自己」——即使带图，目标仍是把她自己画进画面。
- reference：用户给了一张图，要以图中的人/物/场景/风格为素材作画，但主角不是她自己。例如画图中的人物、改图、换背景、照着图画别的角色、模仿图中画风。
- illustration：没有参考图，按文字描述画一幅画，与她本人无关；也包括她主动说要给你画点什么（「我给你画个小猫」「随手涂鸦」「画个简笔画」）。
- cast：画面里全是具体已有的角色（有名字、有立绘），没有她自己。例如「画甘雨和刻晴打牌」「给我画个胡桃」「画刻晴和甘雨背靠背」。这些角色有固定形象，要搜参考图，不能当随手画。

判定原则：
1. 先看画面里有没有她：有她 → self；没有她 → 看有没有具名角色：有 → cast；没有 → 带图选 reference、无图选 illustration。
2. 「画我和 X 一起/合照/合影」「画你俩」「你和她站在一起」→ self，subjects 里把两个人都列出来。
3. 出现「画你」类词时看整体语义：指她本人 → self；明确说画图中某人或别的角色，措辞再像也走 reference。
4. 语义模糊拿不准：带图选 reference，无图选 illustration。
5. 她说「随手画/涂鸦/给你画一个」属于她主动画的小画 → illustration（插画通道，水墨风）；但点名要画某个具体角色（「给你画个甘雨」）仍走 cast。
6. 「画我和 X 一起」和「画 X 和 Y 一起」是两件事：前者 self，后者 cast。

subjects：画面里每个主要人物一项，合照就写 2~4 项，按从左到右或主次排序。
- who：人物名，她自己写「主角色」；
- kind：她自己填 self，其他角色填 character；
- query：其他角色填搜参考图的关键词，写法「角色名 立绘」，不要堆「服装」「全身」「设定图」——关键词越长命中越少；她自己留空。
风景、物件、抽象画就输出空数组。

relation：一句话写清人物之间的站位与动作（如「并排站着看向镜头」「她从后面搂着小鱼肩膀」「一个侧身一个正对镜头」），单人就留空。优先写具体姿势、谁在前谁在后、有没有肢体接触。
layout：构图取景，三选一：portrait（竖构图，单人全身或半身）、landscape（横构图，两人以上横向排开或需要场景）、square（拿不准或单人特写）。两人以上默认 landscape。
outfit_query：她一个人穿某角色的服装（cos）时填「角色名 立绘」；有 subjects 多人时留空。
search_query：单人场景要出现某个已有角色/实物时填关键词；多人已写进 subjects 时留空。

只输出：{"lane":"self","reason":"一句话理由","relation":"","subjects":[],"layout":"square","outfit_query":"","search_query":""}，lane 只能是 self / reference / illustration / cast。"""

[self_prompts]
# 自画像预设（v0.4 从写真插件 photo_system / negative_prompt 提取，可直接编辑）。
# 拼装顺序：request → identity → style → 参考图说明 → avoid
# identity = 人物固定身份特征，画「她」时永远拼在画面描述后面
identity = "出镜人物固定为主角色本人。【此处填写你自己角色的正面外貌设定：只写「是什么」，不写「不是什么」；外貌一致性主要由人物基准参考图承载，文字只作补充。参考实现里该段原为角色专属设定，已占位。】服装以当次提供的「本次造型基准图」为准；请求里明确指定了衣服就照请求画。"
# style = 画风与画面质量约束
style = "画风必须与人物参考图一致：精致的二次元动漫插画风格，全图（含手部、皮肤、衣物、家具、道具）统一为 2D 插画：清晰线稿、赛璐璐平涂上色，不要照片质感、真实皮肤纹理、真实织物细节或摄影景深虚化。画面任何时候都必须清晰可见：夜晚或暗光场景必须有灯光、屏幕光等光源照亮人物面部，严禁剪影、严禁逆光死黑、严禁画面过暗。构图自然生活化，避免商业海报排版与过度磨皮。"
# 开放式引导（2026-11-11）：不写「不要面无表情 / 手要有事做」这类清单，把动作、表情、
# 互动交给模型按情境自己判断——写死规则反而会把它限制成同一种笑法。只说明后果
# （只交代「在哪、穿什么」会得到空脸），具体怎么画由它决定。
scene_hint = "画面里的人怎么站、什么表情、彼此怎么互动，你自己按这句请求的情境判断着写，写具体一点：这一刻该是什么神态、手在做什么、看向谁，都替画面定下来。只交代「在哪、穿什么、做什么」是不够的，那样画出来的人会空着一张脸摆在那里。请求里已经写明了的，以请求为准。"
# avoid 留空（2026-11-11 20:0x）：Seedream 没有独立负面词参数，这串清单原本被拼进 prompt 尾部。
# 画面模型会把被否定的名词当成画面里该有的东西，某次出图里多出的鸟形元素就是
# 被否定的名词被反复提及的结果。身份特征全部改成 identity 里的正面定义；
# 画风与清晰度仍由 style 正面写，水印由 API watermark=False 保证。
# 🔴 别再往这里加「不要画活鸟」——那等于又把这个名词写进 prompt 一次。
avoid = ""
# 带参考图时给模型的「参考图角色说明」
ref_person_hint = "参考图说明：图里标着「本次造型基准」的那张是人物与服装基准，必须保持同一个人、同一套衣服、同一画风；其余参考图只用于姿势、构图与场景，服装一律以基准图为准。"
ref_combo_hint = "参考图说明：第一张是「本次造型基准」，人物长相与服装都以它为准；最后一张是本次画面参考，姿势、构图与场景氛围按它来改，但服装不要被它带偏。"
# 按上一版成品继续改图（「改成…」「表情再生动些」）时用它替代 ref_combo_hint。
# 🔴 这一路必须允许服装跟着上一版走，否则「在上一版上改」会被打回成基准图的衣服。
edit_hint = "这一版是在上一版成品上改：最后一张是上一版成品，以它当底图，人物长相、发型、服装、场景、光线和构图都保持原样，只改本次说明里提到的那部分；上一版如果有手部、比例、五官画歪的地方，顺手一起修正，没提到的不要动。"
# 只有在传入「氛围参考」图（role:mood，带场景的成品图）时才会追加
ref_mood_hint = "参考图里标着「氛围参考」的图只取服装款式与整体气氛，它自带背景（场景、光影、道具）不要照搬。"
# 换装（cos 某角色的标志性服装）专用。出现时替代 ref_combo_hint，
# 并覆盖 identity 里「服装以参考图为准、不要把两张服装混着画」的限制。
outfit_hint = "换装说明：第一张是「本次造型基准」，只管你的长相——脸型、五官比例、瞳色、体型、发色和标志性发饰都保留第一张的，让熟悉你的人一眼认出是你。后面几张都是同一套「服装参考」（可能有全身、侧背面、头饰与纹样细节），把它们的服装剪裁、主色搭配、纹样、鞋靴、头饰和标志性道具整体换成你身上的，并按你的体型调整穿着效果；多张服装参考是同一套衣服的不同角度，不要当成几套不同的衣服。发色保留你的设定，可以佩戴服装参考里的头饰、尽量还原它的发型，但脸必须还是第一张那张脸，不要采用任何一张服装参考的脸或五官。这是有意的换装，不是把几张图混着画。"
# 多人合照（她 + 其他角色）专用。出现时替代 outfit_hint / ref_combo_hint。
# 关键是把「别混脸」和「别换装」都写死：单人版提示词全在为「只有一个人」服务，
# 直接拿去画两个人，模型会把两张脸揉成同一张、或者把两套衣服互换。
group_hint = "多人合照说明：参考图按顺序对应画面里的人物，同一位角色可能连着给好几张。每个人的长相、五官、发色、瞳色、体型只认自己名下的参考图，绝不要把两个人的脸、发型或服装混在一起，也不要让两个人长得像同一个人；服装各穿各的，不要互换。同一位角色名下的多张图是同一套外形和服装的不同角度、全身与细节，只用来把造型看全，画面里这个人仍然只出现一次，不要按参考图张数画成几个人。画面里每个角色都必须出现，但不要求人人正面站直：可以搂肩、拥抱、牵手、前后错位、一人侧身或背对镜头、互相遮挡一部分，按人物关系自然摆姿势；不要因为遮挡或角度就少画一个人。上面 identity 里「两张服装不同的参考图不要混着画」只约束你自己那部分，其他角色按他们各自的参考图穿，不要套用你的衣服。"
# cast 通道（画面里全是别人、没有她自己）专用。
# ⚠️ 不要套 identity（那是主角色的长相），也不要用 avoid（里面有「汉服/和服/欧式宫廷礼服」，
# 画原神角色会直接打架）。
cast_hint = "角色参考图说明：参考图按顺序依次对应画面里的每个角色，同一位角色可能连着给好几张。每个角色的长相、五官、发色、瞳色、体型和服装只认自己名下的参考图，不要把不同角色的特征混在一起，也不要让他们长得像同一个人。同一位角色名下的多张图是同一套造型的不同角度和细节，只用来把外形看全，画面里这个人仍然只出现一次。画面里每个角色都必须出现，可以搂肩、并肩、前后错位、一人侧身或背对镜头、互相遮挡一部分，按人物关系自然摆姿势，不要因为遮挡或角度就少画一个人。"
cast_avoid = "文字、水印、logo、重复人物、畸形手指、海报排版、真人照片质感"

[illustration]
# 聊天里的手绘画（「给你画个小猫」「随手涂鸦」）固定走插画通道 + 水墨风。
# 引擎仍由 [engines].illustration_engine 决定（默认 drawpic，不单独计费，右下角带 AI 水印）。
# 风格句拼在用户描述后面：手绘画不追求精细，调子统一比每次都换画风重要。
enabled = true
style = "画风固定为写意水墨小品：宣纸质感，墨色分出浓淡干湿，线条简练带笔锋，留白充足，可以少量淡彩点染；不要厚涂、不要赛璐璐平涂、不要 3D、不要照片写实。"
avoid = "厚涂、赛璐璐平涂、日系厚线稿、3D 渲染、照片写实、油画、水印、文字、logo"

[wardrobe]
# 造型库：一套衣服 = 图库里若干资产用 outfit:<id> 标签归组，
# 再用 season: / scene: / style: / theme: / role: 标注用途。
# 这里只定义「几月算哪个季节」。加一套新衣服只需传图 + 打标签，
# 不用改提示词、不用改代码。月份重叠时按 winter → summer → 其余(春秋) 的顺序先命中先算。
enabled = true
winter_months = [
    11,
    12,
    1,
    2,
    3,
]
summer_months = [
    6,
    7,
    8,
    9,
]
# 人物图库最多放几张（每套造型占 2~3 张；画自己时只喂选中造型的 2~4 张）
max_assets = 20
# 例：想让 4 月也穿冬装，把 4 加进 winter_months 即可，保存即热重载。

# 同一季节有多套日常款时，按请求里的场景词挑 scene: 标签对应的造型。
# 没命中任何场景词就用图库里靠前的那套。词表可随意加，逗号分隔。
[wardrobe.scene_keywords]
home = "宿舍,家里,家中,在家,室内,房间,床上,被窝,沙发,客厅,桌子前,书桌"
outing = "出门,外面,街上,路上,散步,食堂,超市,图书馆,教室,上课"

[engines]
# 通道 → 引擎。换引擎只改这里，不用动代码。
# self = 图生图引擎：agent 本地持有「人物形象参考图」，需要时和会话参考图一起喂交给图生图引擎
#        （旧 maitu 引擎只吃人物图库，吃不了会话里的临时参考图）
self_engine = "ark"
# drawpic = 不单独计费，但右下角有「AI生成」水印（硅基强制，参数关不掉）
# ark     = 按引擎计价，无水印
illustration_engine = "drawpic"
# 只允许真正支持参考图的引擎。drawpic 的可图会被静默丢图，不能放进来。
reference_engine = "ark"

[engines.ark]
# Seedream 类图生图模型。主模型被版权拦截时才切兜底，其余失败不重试。
enabled = true
base_url = "https://ark.cn-beijing.volces.com/api/v3"
# 留空则自动读取 maitu-photo-studio/config.toml，不用填两遍
api_key = ""
model = "doubao-seedream-5-0-flash-260915"
fallback_model = "doubao-seedream-4-0-20260415"
# 单次最多几张参考图（输入图不计费，Seedream 5.0 flash 官方上限 10 张）
max_references = 10
price = 0.12
fallback_price = 0.20
request_timeout_seconds = 180
